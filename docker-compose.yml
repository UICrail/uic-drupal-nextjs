version: '3.8'

services:
  # MariaDB Database
  mariadb:
    image: mariadb:10.11
    container_name: next-drupal-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-drupal}
      MYSQL_USER: ${MYSQL_USER:-drupal}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-drupal}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    networks:
      - next-drupal-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: next-drupal-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASS:-redis}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - next-drupal-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Elasticsearch
  elasticsearch:
    build:
      context: ./silta
      dockerfile: elasticsearch.Dockerfile
      args:
        ES_VERSION: ${ES_VERSION:-8.13.4}
    container_name: next-drupal-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "${ES_PORT:-9200}:9200"
      - "${ES_PORT_TRANSPORT:-9300}:9300"
    networks:
      - next-drupal-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Drupal PHP-FPM
  drupal-php:
    build:
      context: ./drupal
      dockerfile: ../docker/drupal/Dockerfile
    container_name: next-drupal-php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./drupal:/var/www/html
      - drupal_files:/var/www/html/web/sites/default/files
      - drupal_private:/var/www/html/private
    environment:
      - DB_HOST=mariadb
      - DB_NAME=${MYSQL_DATABASE:-drupal}
      - DB_USER=${MYSQL_USER:-drupal}
      - DB_PASSWORD=${MYSQL_PASSWORD:-drupal}
      - DB_PORT=3306
      - DRUPAL_REVALIDATE_SECRET=${DRUPAL_REVALIDATE_SECRET:-revalidate_secret_not_secure_used_only_locally}
      - DRUPAL_CLIENT_SECRET=${DRUPAL_CLIENT_SECRET:-drupal_client_secret_not_secure_used_only_locally}
      - DRUPAL_CLIENT_ID=${DRUPAL_CLIENT_ID:-drupal-client-id}
      - DRUPAL_CLIENT_VIEWER_ID=${DRUPAL_CLIENT_VIEWER_ID:-drupal-client-viewer-id}
      - DRUPAL_CLIENT_VIEWER_SECRET=${DRUPAL_CLIENT_VIEWER_SECRET:-drupal_client_viewer_secret_not_secure_used_only_locally}
      - WUNDER_NEXT_FRONTEND_URL=${WUNDER_NEXT_FRONTEND_URL:-http://frontend:3000}
      - ENVIRONMENT_NAME=${ENVIRONMENT_NAME:-docker}
      - HASH_SALT=${HASH_SALT:-notsosecurehashnotsosecurehashnotsosecurehash}
      - NEXT_PUBLIC_DRUPAL_BASE_URL=${NEXT_PUBLIC_DRUPAL_BASE_URL:-http://drupal}
      - DRUPAL_BASE_URL_INTERNAL=http://drupal-nginx
      - DRUPAL_BASE_URL_INTERNAL_IMAGES=http://drupal-nginx
      - REDIS_HOST=redis
      - REDIS_PASS=${REDIS_PASS:-redis}
      - ES_HOST=elasticsearch
      - SMTP_ADDRESS=${SMTP_ADDRESS:-mailhog:1025}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - next-drupal-network
    healthcheck:
      test: ["CMD", "php", "-r", "echo 'OK';"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Drupal Nginx
  drupal-nginx:
    build:
      context: ./silta
      dockerfile: nginx.Dockerfile
    container_name: next-drupal-nginx
    restart: unless-stopped
    volumes:
      - ./drupal:/app/web
      - drupal_files:/app/web/sites/default/files
      - ./docker/nginx/drupal.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${DRUPAL_PORT:-8080}:80"
    depends_on:
      - drupal-php
    networks:
      - next-drupal-network

  # Next.js Application
  nextjs:
    build:
      context: ./next
      dockerfile: ../docker/next/Dockerfile
      target: development
    container_name: next-drupal-nextjs
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./next:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - DRUPAL_REVALIDATE_SECRET=${DRUPAL_REVALIDATE_SECRET:-revalidate_secret_not_secure_used_only_locally}
      - DRUPAL_CLIENT_SECRET=${DRUPAL_CLIENT_SECRET:-drupal_client_secret_not_secure_used_only_locally}
      - DRUPAL_CLIENT_ID=${DRUPAL_CLIENT_ID:-drupal-client-id}
      - DRUPAL_CLIENT_VIEWER_ID=${DRUPAL_CLIENT_VIEWER_ID:-drupal-client-viewer-id}
      - DRUPAL_CLIENT_VIEWER_SECRET=${DRUPAL_CLIENT_VIEWER_SECRET:-drupal_client_viewer_secret_not_secure_used_only_locally}
      - NEXT_PUBLIC_DRUPAL_BASE_URL=${NEXT_PUBLIC_DRUPAL_BASE_URL:-http://drupal-nginx}
      - DRUPAL_BASE_URL_INTERNAL=http://drupal-nginx
      - DRUPAL_BASE_URL_INTERNAL_IMAGES=http://drupal-nginx
      - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL:-http://localhost:3000}
      - AUTH_SECRET=${AUTH_SECRET:-nextauth_secret_not_secure_used_only_locally}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST:-true}
      - AUTH_URL=${AUTH_URL:-http://localhost:3000}
      - REDIS_HOST=redis
      - REDIS_PASS=${REDIS_PASS:-redis}
    ports:
      - "${NEXTJS_PORT:-3000}:3000"
    depends_on:
      - drupal-nginx
      - redis
    networks:
      - next-drupal-network
    command: npm run dev

  # MailHog (for email testing)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: next-drupal-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_WEB_PORT:-8025}:8025"
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
    networks:
      - next-drupal-network

  # Nginx Reverse Proxy
  nginx-proxy:
    image: nginx:alpine
    container_name: next-drupal-proxy
    restart: unless-stopped
    volumes:
      - ./docker/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    depends_on:
      - drupal-nginx
      - nextjs
    networks:
      - next-drupal-network

networks:
  next-drupal-network:
    driver: bridge

volumes:
  mariadb_data:
  redis_data:
  elasticsearch_data:
  drupal_files:
  drupal_private:

